name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9dc71a7c6b9147da875b0e4814d89feb # v5.3.0
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import src.one_setup_all_agents as m; print(m.__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: Git tag v$TAG does not match package __version__ $VERSION"
            exit 1
          fi

      - name: Check distribution artifacts
        run: python scripts/check_dist.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
